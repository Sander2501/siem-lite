services:
  prometheus:
    image: prom/prometheus:latest
    container_name: siem-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    container_name: siem-grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
